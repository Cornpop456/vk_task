syntax = "proto3";

package subpub;

option go_package = "github.com/Cornpop456/vk_task/api/proto";

import "google/protobuf/empty.proto";

// Сервис подписок
service Pubsub {
  // Подписка (сервер отправляет поток событий)
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  
  // Публикация (классический запрос-ответ)
  rpc Publish(PublishRequest) returns (google.protobuf.Empty);
}

// Запрос на подписку с указанием ключа
message SubscribeRequest {
  string key = 1;
}

// Запрос на публикацию с ключом и данными
message PublishRequest {
  string key = 1;
  string data = 2;
}

// Событие, которое получает подписчик
message Event {
  string data = 1;
}